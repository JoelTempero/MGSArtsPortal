<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Confirmation - MGS Arts Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1219 100%);
            min-height: 100vh;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #c9a227 0%, #dbb42c 100%);
            color: #1a1f2e;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .card-body {
            padding: 2rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #c9a227;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: #dc2626;
        }

        .error-message svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
        }

        .lesson-details {
            margin-bottom: 2rem;
        }

        .lesson-item {
            display: flex;
            justify-content: space-between;
            padding: 0.875rem 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .lesson-item:last-child {
            border-bottom: none;
        }

        .lesson-label {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .lesson-value {
            font-weight: 600;
            color: #1f2937;
        }

        .lesson-student {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1f2e;
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #c9a227;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-accept {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
        }

        .btn-accept:hover:not(:disabled) {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }

        .btn-waitlist {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: white;
        }

        .btn-waitlist:hover:not(:disabled) {
            background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .success-message {
            text-align: center;
            padding: 2rem;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .waitlist-icon {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
        }

        .success-message h2 {
            color: #1a1f2e;
            margin-bottom: 0.5rem;
        }

        .success-message p {
            color: #6b7280;
        }

        .already-responded {
            text-align: center;
            padding: 2rem;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .already-responded svg {
            width: 48px;
            height: 48px;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .status-accepted {
            background: #d1fae5;
            color: #059669;
        }

        .status-waitlist {
            background: #fef3c7;
            color: #d97706;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Lesson Confirmation</h1>
                <p>MGS Performing Arts</p>
            </div>
            <div class="card-body" id="content">
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading lesson details...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCL2ZHktfHNsFX6vI0mVY-i5WqM1Hb94RY",
            authDomain: "mgs-performing-arts.firebaseapp.com",
            projectId: "mgs-performing-arts",
            storageBucket: "mgs-performing-arts.firebasestorage.app",
            messagingSenderId: "968636316312",
            appId: "1:968636316312:web:1b233ae8e176ceea85aeed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contentEl = document.getElementById('content');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError('Invalid link', 'This link is missing required information. Please use the link from your email.');
        } else {
            loadLessonDetails();
        }

        async function loadLessonDetails() {
            try {
                // Fetch the token document
                const tokenRef = doc(db, 'lessonTokens', token);
                const tokenDoc = await getDoc(tokenRef);

                if (!tokenDoc.exists()) {
                    showError('Link expired or invalid', 'This link may have expired or is no longer valid. Please contact the school for a new link.');
                    return;
                }

                const tokenData = tokenDoc.data();

                // Check if token has expired
                if (tokenData.expiresAt && new Date(tokenData.expiresAt) < new Date()) {
                    showError('Link expired', 'This link has expired. Please contact the school for a new link.');
                    return;
                }

                // Fetch the lesson details
                const lessonRef = doc(db, 'lessons', tokenData.lessonId);
                const lessonDoc = await getDoc(lessonRef);

                if (!lessonDoc.exists()) {
                    showError('Lesson not found', 'The lesson associated with this link could not be found.');
                    return;
                }

                const lesson = { id: lessonDoc.id, ...lessonDoc.data() };

                // Show the lesson details
                showLessonDetails(lesson, tokenData);

            } catch (error) {
                console.error('Error loading lesson:', error);
                showError('Something went wrong', 'There was an error loading the lesson details. Please try again later.');
            }
        }

        function showError(title, message) {
            contentEl.innerHTML = `
                <div class="error-message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <h2>${title}</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function showLessonDetails(lesson, tokenData) {
            // Check if already responded
            if (lesson.acknowledged) {
                contentEl.innerHTML = `
                    <div class="already-responded">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                        <h2>Already Responded</h2>
                        <p>You have already responded to this lesson request.</p>
                        <span class="status-badge ${lesson.acknowledgmentStatus === 'accepted' ? 'status-accepted' : 'status-waitlist'}">
                            ${lesson.acknowledgmentStatus === 'accepted' ? 'Lesson Accepted' : 'Added to Waitlist'}
                        </span>
                    </div>
                    <div class="lesson-details" style="margin-top: 1.5rem;">
                        <div class="lesson-student">${lesson.studentName || 'Unknown Student'}</div>
                        <div class="lesson-item">
                            <span class="lesson-label">Instrument</span>
                            <span class="lesson-value">${lesson.instrument || 'N/A'}</span>
                        </div>
                        <div class="lesson-item">
                            <span class="lesson-label">Day</span>
                            <span class="lesson-value">${lesson.day || 'TBC'}</span>
                        </div>
                        <div class="lesson-item">
                            <span class="lesson-label">Time</span>
                            <span class="lesson-value">${lesson.time || 'TBC'}</span>
                        </div>
                    </div>
                `;
                return;
            }

            contentEl.innerHTML = `
                <div class="lesson-details">
                    <div class="lesson-student">${lesson.studentName || 'Unknown Student'}</div>
                    <div class="lesson-item">
                        <span class="lesson-label">Instrument</span>
                        <span class="lesson-value">${lesson.instrument || 'N/A'}</span>
                    </div>
                    <div class="lesson-item">
                        <span class="lesson-label">Day</span>
                        <span class="lesson-value">${lesson.day || 'TBC'}</span>
                    </div>
                    <div class="lesson-item">
                        <span class="lesson-label">Time</span>
                        <span class="lesson-value">${lesson.time || 'TBC'}</span>
                    </div>
                    ${lesson.location ? `
                    <div class="lesson-item">
                        <span class="lesson-label">Location</span>
                        <span class="lesson-value">${lesson.location}</span>
                    </div>
                    ` : ''}
                </div>

                <p style="color: #6b7280; text-align: center; margin-bottom: 1rem;">
                    Please confirm if you can teach this lesson:
                </p>

                <div class="action-buttons">
                    <button class="btn btn-accept" id="btn-accept" onclick="handleResponse('accepted')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                        Accept Lesson
                    </button>
                    <button class="btn btn-waitlist" id="btn-waitlist" onclick="handleResponse('waitlist')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                        Add to Waitlist
                    </button>
                </div>

                <div class="footer-note">
                    <p>Your response will be recorded and the school will be notified.</p>
                </div>
            `;

            // Expose handleResponse to global scope
            window.handleResponse = async function(status) {
                const acceptBtn = document.getElementById('btn-accept');
                const waitlistBtn = document.getElementById('btn-waitlist');

                acceptBtn.disabled = true;
                waitlistBtn.disabled = true;

                try {
                    // Update the lesson with acknowledgment
                    const lessonRef = doc(db, 'lessons', lesson.id);
                    await updateDoc(lessonRef, {
                        acknowledged: true,
                        acknowledgedAt: new Date().toISOString(),
                        acknowledgmentStatus: status,
                        updatedAt: serverTimestamp()
                    });

                    // Show success message
                    if (status === 'accepted') {
                        contentEl.innerHTML = `
                            <div class="success-message">
                                <div class="success-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 6L9 17l-5-5"/>
                                    </svg>
                                </div>
                                <h2>Lesson Accepted!</h2>
                                <p>Thank you for confirming. The school has been notified that you will be teaching ${lesson.studentName || 'this student'}.</p>
                            </div>
                            <div class="lesson-details" style="margin-top: 1.5rem; background: #f9fafb; padding: 1rem; border-radius: 8px;">
                                <div class="lesson-item">
                                    <span class="lesson-label">Student</span>
                                    <span class="lesson-value">${lesson.studentName || 'Unknown'}</span>
                                </div>
                                <div class="lesson-item">
                                    <span class="lesson-label">Instrument</span>
                                    <span class="lesson-value">${lesson.instrument || 'N/A'}</span>
                                </div>
                                <div class="lesson-item">
                                    <span class="lesson-label">Day & Time</span>
                                    <span class="lesson-value">${lesson.day || 'TBC'} ${lesson.time || ''}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        contentEl.innerHTML = `
                            <div class="success-message">
                                <div class="success-icon waitlist-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M12 6v6l4 2"/>
                                    </svg>
                                </div>
                                <h2>Added to Waitlist</h2>
                                <p>Thank you for letting us know. The school has been notified that this student has been added to your waitlist.</p>
                            </div>
                            <div class="lesson-details" style="margin-top: 1.5rem; background: #f9fafb; padding: 1rem; border-radius: 8px;">
                                <div class="lesson-item">
                                    <span class="lesson-label">Student</span>
                                    <span class="lesson-value">${lesson.studentName || 'Unknown'}</span>
                                </div>
                                <div class="lesson-item">
                                    <span class="lesson-label">Instrument</span>
                                    <span class="lesson-value">${lesson.instrument || 'N/A'}</span>
                                </div>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('Error saving response:', error);
                    acceptBtn.disabled = false;
                    waitlistBtn.disabled = false;
                    alert('There was an error saving your response. Please try again.');
                }
            };
        }
    </script>
</body>
</html>
