<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - MGS Arts Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1219 100%);
            min-height: 100vh;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .card-header {
            background: linear-gradient(135deg, #c9a227 0%, #dbb42c 100%);
            color: #1a1f2e;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .card-body {
            padding: 2rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #c9a227;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: #dc2626;
        }

        .error-message svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
        }

        /* Auth Form */
        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .auth-form h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a1f2e;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c9a227;
        }

        .form-hint {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c9a227 0%, #dbb42c 100%);
            color: #1a1f2e;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #b8921f 0%, #c9a227 100%);
        }

        .btn-complete {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
        }

        .btn-complete:hover:not(:disabled) {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Staff Welcome */
        .staff-welcome {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #c9a227;
        }

        .staff-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c9a227 0%, #dbb42c 100%);
            color: #1a1f2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 auto 1rem;
        }

        .staff-welcome h2 {
            color: #1a1f2e;
            margin-bottom: 0.25rem;
        }

        .staff-welcome p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        /* Summary Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #f9fafb;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1f2e;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card.overdue .stat-value {
            color: #dc2626;
        }

        /* Events List */
        .events-section h3 {
            color: #1a1f2e;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-count {
            background: #f3f4f6;
            color: #6b7280;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .event-card {
            background: #f9fafb;
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #e5e7eb;
        }

        .event-card.has-overdue {
            border-left: 4px solid #dc2626;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .event-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: #1a1f2e;
        }

        .event-date {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        .event-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-upcoming {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-soon {
            background: #fef3c7;
            color: #d97706;
        }

        .badge-today {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-past {
            background: #f3f4f6;
            color: #6b7280;
        }

        /* Tasks */
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .tasks-header h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
        }

        .tasks-progress {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .task-checkbox.completed {
            background: #10b981;
            border-color: #10b981;
        }

        .task-checkbox.completed svg {
            color: white;
        }

        .task-checkbox svg {
            width: 14px;
            height: 14px;
            color: transparent;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 0.9rem;
            color: #374151;
        }

        .task-name.completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        .task-due {
            color: #6b7280;
        }

        .task-due.overdue {
            color: #dc2626;
            font-weight: 600;
        }

        .task-due.today {
            color: #d97706;
            font-weight: 600;
        }

        .no-events {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .no-events svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .footer-note {
            text-align: center;
            padding: 1rem;
            color: #9ca3af;
            font-size: 0.85rem;
            background: #f9fafb;
            border-radius: 8px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .event-header {
                flex-direction: column;
                gap: 0.5rem;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Staff Event Portal</h1>
                <p>MGS Performing Arts</p>
            </div>
            <div class="card-body" id="content">
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import {
            getFirestore,
            doc,
            getDoc,
            getDocs,
            collection,
            query,
            where,
            updateDoc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCL2ZHktfHNsFX6vI0mVY-i5WqM1Hb94RY",
            authDomain: "mgs-performing-arts.firebaseapp.com",
            projectId: "mgs-performing-arts",
            storageBucket: "mgs-performing-arts.firebasestorage.app",
            messagingSenderId: "968636316312",
            appId: "1:968636316312:web:1b233ae8e176ceea85aeed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contentEl = document.getElementById('content');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let currentStaff = null;
        let currentEvents = [];

        if (!token) {
            showError('Invalid link', 'This link is missing required information. Please use the link from your email.');
        } else {
            loadStaffToken();
        }

        async function loadStaffToken() {
            try {
                // Fetch the staff token document
                const tokenRef = doc(db, 'staffTokens', token);
                const tokenDoc = await getDoc(tokenRef);

                if (!tokenDoc.exists()) {
                    showError('Link expired or invalid', 'This link may have expired or is no longer valid. Please contact the school for a new link.');
                    return;
                }

                const tokenData = tokenDoc.data();

                // Check if token has expired
                if (tokenData.expiresAt && new Date(tokenData.expiresAt) < new Date()) {
                    showError('Link expired', 'This link has expired. Please contact the school for a new link.');
                    return;
                }

                // Fetch the staff details
                const staffRef = doc(db, 'tutors', tokenData.staffId);
                const staffDoc = await getDoc(staffRef);

                if (!staffDoc.exists()) {
                    showError('Staff not found', 'The staff member associated with this link could not be found.');
                    return;
                }

                currentStaff = { id: staffDoc.id, ...staffDoc.data() };

                // Check if already authenticated in this session
                const sessionAuth = sessionStorage.getItem(`staff_auth_${token}`);
                if (sessionAuth === 'true') {
                    await loadStaffEvents();
                } else {
                    showAuthForm();
                }

            } catch (error) {
                console.error('Error loading token:', error);
                showError('Something went wrong', 'There was an error loading the page. Please try again later.');
            }
        }

        function showError(title, message) {
            contentEl.innerHTML = `
                <div class="error-message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <h2>${title}</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function showAuthForm() {
            contentEl.innerHTML = `
                <div class="auth-form">
                    <h2>Verify Your Identity</h2>
                    <p style="text-align: center; color: #6b7280; margin-bottom: 1.5rem;">
                        Please enter your last name to access your events.
                    </p>
                    <form id="auth-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" placeholder="Enter your last name" required autocomplete="off">
                            <p class="form-hint">This must match the last name on file.</p>
                        </div>
                        <button type="submit" class="btn btn-primary" id="verify-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4"/>
                                <circle cx="12" cy="12" r="10"/>
                            </svg>
                            Verify & Continue
                        </button>
                    </form>
                    <p id="auth-error" style="color: #dc2626; text-align: center; margin-top: 1rem; display: none;"></p>
                </div>
            `;

            document.getElementById('auth-form').addEventListener('submit', handleAuth);
        }

        async function handleAuth(e) {
            e.preventDefault();
            const lastNameInput = document.getElementById('last-name');
            const verifyBtn = document.getElementById('verify-btn');
            const errorEl = document.getElementById('auth-error');

            const enteredLastName = lastNameInput.value.trim().toLowerCase();

            // Get the staff's last name (last word in name)
            const staffNameParts = currentStaff.name.trim().split(' ');
            const staffLastName = staffNameParts[staffNameParts.length - 1].toLowerCase();

            if (enteredLastName === staffLastName) {
                // Authenticated - save to session
                sessionStorage.setItem(`staff_auth_${token}`, 'true');

                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<div class="loading-spinner" style="width: 20px; height: 20px; margin: 0;"></div> Loading...';

                await loadStaffEvents();
            } else {
                errorEl.textContent = 'Last name does not match our records. Please try again.';
                errorEl.style.display = 'block';
                lastNameInput.value = '';
                lastNameInput.focus();
            }
        }

        async function loadStaffEvents() {
            try {
                // Fetch all events
                const eventsSnapshot = await getDocs(collection(db, 'events'));

                currentEvents = [];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                eventsSnapshot.forEach(doc => {
                    const event = { id: doc.id, ...doc.data() };
                    // Only include events where this staff member is involved
                    if (event.staffIds && event.staffIds.includes(currentStaff.id)) {
                        // Process tasks assigned to this staff member
                        const myTasks = (event.tasks || []).filter(task => {
                            const assignedIds = task.assignedToIds || (task.assignedTo ? [task.assignedTo] : []);
                            return assignedIds.includes(currentStaff.id);
                        });

                        // Calculate task due dates and status
                        const eventDate = new Date(event.date);
                        const processedTasks = myTasks.map(task => {
                            let dueDate;
                            if (task.dueDate) {
                                dueDate = new Date(task.dueDate);
                            } else if (task.daysBefore !== undefined) {
                                dueDate = new Date(eventDate);
                                dueDate.setDate(dueDate.getDate() - task.daysBefore);
                            } else {
                                dueDate = eventDate;
                            }

                            const isOverdue = !task.completed && dueDate < today;
                            const isDueToday = dueDate.toDateString() === today.toDateString();

                            return {
                                ...task,
                                dueDate,
                                isOverdue,
                                isDueToday
                            };
                        });

                        event.myTasks = processedTasks;
                        event.hasOverdueTasks = processedTasks.some(t => t.isOverdue);
                        currentEvents.push(event);
                    }
                });

                // Sort by date (upcoming first)
                currentEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

                renderStaffPortal();

            } catch (error) {
                console.error('Error loading events:', error);
                showError('Error loading events', 'There was a problem loading your events. Please try again.');
            }
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString('en-NZ', {
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        function getEventBadge(eventDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const date = new Date(eventDate);
            date.setHours(0, 0, 0, 0);

            const diffDays = Math.ceil((date - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { class: 'badge-past', text: 'Past' };
            if (diffDays === 0) return { class: 'badge-today', text: 'Today' };
            if (diffDays <= 7) return { class: 'badge-soon', text: `${diffDays} day${diffDays > 1 ? 's' : ''} away` };
            return { class: 'badge-upcoming', text: 'Upcoming' };
        }

        function renderStaffPortal() {
            // Calculate stats
            const totalTasks = currentEvents.reduce((sum, e) => sum + e.myTasks.length, 0);
            const completedTasks = currentEvents.reduce((sum, e) => sum + e.myTasks.filter(t => t.completed).length, 0);
            const overdueTasks = currentEvents.reduce((sum, e) => sum + e.myTasks.filter(t => t.isOverdue).length, 0);

            const upcomingEvents = currentEvents.filter(e => new Date(e.date) >= new Date());

            contentEl.innerHTML = `
                <div class="staff-welcome">
                    <div class="staff-avatar">${getInitials(currentStaff.name)}</div>
                    <h2>Welcome, ${currentStaff.name}</h2>
                    <p>View your assigned events and tasks below.</p>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value">${upcomingEvents.length}</div>
                        <div class="stat-label">Events</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${completedTasks}/${totalTasks}</div>
                        <div class="stat-label">Tasks Done</div>
                    </div>
                    <div class="stat-card ${overdueTasks > 0 ? 'overdue' : ''}">
                        <div class="stat-value">${overdueTasks}</div>
                        <div class="stat-label">Overdue</div>
                    </div>
                </div>

                ${currentEvents.length === 0 ? `
                    <div class="no-events">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <h3>No Events Assigned</h3>
                        <p>You don't have any events assigned yet.</p>
                    </div>
                ` : `
                    <div class="events-section">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            Your Events
                            <span class="event-count">${currentEvents.length}</span>
                        </h3>
                        ${currentEvents.map(event => renderEventCard(event)).join('')}
                    </div>
                `}

                <div class="footer-note" style="margin-top: 2rem;">
                    <p>Need help? Contact the Performing Arts Department at MGS.</p>
                </div>
            `;
        }

        function renderEventCard(event) {
            const badge = getEventBadge(event.date);
            const completedCount = event.myTasks.filter(t => t.completed).length;

            return `
                <div class="event-card ${event.hasOverdueTasks ? 'has-overdue' : ''}" data-event-id="${event.id}">
                    <div class="event-header">
                        <div>
                            <div class="event-name">${event.name}</div>
                            <div class="event-date">${formatDate(event.date)} ${event.time ? '- ' + event.time : ''} ${event.location ? '@ ' + event.location : ''}</div>
                        </div>
                        <span class="event-badge ${badge.class}">${badge.text}</span>
                    </div>

                    ${event.myTasks.length > 0 ? `
                        <div class="tasks-section">
                            <div class="tasks-header">
                                <h4>Your Tasks</h4>
                                <span class="tasks-progress">${completedCount}/${event.myTasks.length} complete</span>
                            </div>
                            ${event.myTasks.map(task => renderTaskItem(event.id, task)).join('')}
                        </div>
                    ` : `
                        <p style="color: #6b7280; font-size: 0.9rem;">No specific tasks assigned to you for this event.</p>
                    `}
                </div>
            `;
        }

        function renderTaskItem(eventId, task) {
            const dueClass = task.isOverdue ? 'overdue' : (task.isDueToday ? 'today' : '');
            const dueText = task.isOverdue ? 'OVERDUE' : (task.isDueToday ? 'Due Today' : `Due ${formatDate(task.dueDate)}`);

            return `
                <div class="task-item" data-task-name="${task.name}">
                    <div class="task-checkbox ${task.completed ? 'completed' : ''}" onclick="toggleTask('${eventId}', '${task.name.replace(/'/g, "\\'")}', ${!task.completed})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>
                    <div class="task-content">
                        <div class="task-name ${task.completed ? 'completed' : ''}">${task.name}</div>
                        <div class="task-meta">
                            <span class="task-due ${dueClass}">${dueText}</span>
                            ${task.notes ? `<span>- ${task.notes}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Expose to global scope
        window.toggleTask = async function(eventId, taskName, completed) {
            try {
                // Find the event
                const event = currentEvents.find(e => e.id === eventId);
                if (!event) return;

                // Get the current event data from Firestore
                const eventRef = doc(db, 'events', eventId);
                const eventDoc = await getDoc(eventRef);

                if (!eventDoc.exists()) return;

                const eventData = eventDoc.data();
                const tasks = eventData.tasks || [];

                // Find and update the task
                const taskIndex = tasks.findIndex(t => t.name === taskName);
                if (taskIndex !== -1) {
                    tasks[taskIndex].completed = completed;
                    if (completed) {
                        tasks[taskIndex].completedAt = new Date().toISOString();
                        tasks[taskIndex].completedBy = currentStaff.id;
                    }
                }

                // Update in Firestore
                await updateDoc(eventRef, {
                    tasks: tasks,
                    updatedAt: serverTimestamp()
                });

                // Update local data
                const localTask = event.myTasks.find(t => t.name === taskName);
                if (localTask) {
                    localTask.completed = completed;
                }

                // Re-render
                renderStaffPortal();

            } catch (error) {
                console.error('Error updating task:', error);
                alert('There was an error updating the task. Please try again.');
            }
        };
    </script>
</body>
</html>
